<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outcognito Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #121212;
        color: #ffffff;
        padding: 40px;
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        color: #bb86fc;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
      }
      .setting-group {
        background-color: #1e1e1e;
        padding: 20px;
        border-radius: 8px;
        margin-top: 20px;
        border: 1px solid #333;
      }
      button {
        background-color: #cf6679;
        color: white;
        border: none;
        padding: 10px 16px;
        font-size: 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #ff7597;
      }
      #status-msg {
        margin-top: 10px;
        color: #03dac6;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Outcognito Settings</h1>
    
    <div class="setting-group">
      <h2>Data Management</h2>
      <p style="color: #a0a0a0;">Permanently delete all tracking data for today. This action cannot be undone.</p>
      <button id="btn-clear-data">Clear Daily Stats</button>
      <p id="status-msg"></p>
    </div>

    <!-- Script points into the src folder where our TS logic will live -->
    <!-- Change this line at the bottom of options.html -->
    <script type="module" src="options.js"></script>
  </body>
</html>
